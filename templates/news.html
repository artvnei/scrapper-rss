{{define "title"}}News{{end}}
{{define "content"}}
<h1>News</h1>
<div class="row mb-4">
  <div class="col-md-4">
    <h4>Status Counts</h4>
    <ul class="list-group">
    {{range $k, $v := .Counts}}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        {{$k}} <span class="badge bg-primary rounded-pill">{{$v}}</span>
      </li>
    {{end}}
    </ul>
  </div>
</div>
<h2 class="mt-4">Latest News</h2>
<table class="table table-striped">
  <thead><tr><th>Title</th><th>Status</th><th>Created At</th></tr></thead>
  <tbody>
  {{range .News}}
  <tr>
    <td>{{.Title}}</td>
    <td>{{.Status}}</td>
    <td>{{.CreatedAt}}</td>
  </tr>
  {{end}}
  </tbody>
</table>
{{end}}
